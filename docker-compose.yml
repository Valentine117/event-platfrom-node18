version: "3.8"

services:
  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - app_net
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # 관리 UI
    networks:
      - app_net

  mongodb:
    image: mongo:7
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    environment: [ MONGO_INITDB_DATABASE=event-reward-platform-dev ]
    networks:
      - app_net


  gateway:
    build:
      context: .
      dockerfile: ./apps/gateway/Dockerfile
    container_name: gateway
    ports:
      - "3000:3000"
    volumes:
      - ./ssl:/app/ssl  # 👈 로컬 인증서를 컨테이너에 마운트
    environment:
      PORT: 3000
      JWT_SECRET: my_jwt_secret
      AUTH_SERVICE_URL: http://auth:3001
      EVENT_SERVICE_URL: http://event:3002
      MONGO_URI: mongodb://mongodb:27017/event-reward-platform-dev
      REDIS_URL: redis://redis:6379
    depends_on:
      - mongodb
      - auth
      - event
    networks:
      app_net:
        ipv4_address: 172.19.0.100 # 화이트 리스트 관리를 위한 gateway ip 고정

  auth:
    build:
      context: .
      dockerfile: ./apps/auth/Dockerfile
    container_name: auth
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      JWT_SECRET: my_jwt_secret
      MONGO_URI: mongodb://mongodb:27017/event-reward-platform-dev
      GATEWAY_SERVICE_URL: https://gateway:3000
    depends_on:
      - mongodb
    networks:
      - app_net

  event:
    build:
      context: .
      dockerfile: ./apps/event/Dockerfile
    container_name: event
    ports:
      - "3002:3002"
    environment:
      PORT: 3002
      JWT_SECRET: my_jwt_secret
      MONGO_URI: mongodb://mongodb:27017/event-reward-platform-dev
      GATEWAY_SERVICE_URL: https://gateway:3000
      REDIS_URL: redis://redis:6379
    depends_on:
      - mongodb
      - redis
    networks:
      - app_net

volumes:
  mongo-data:

networks:
  app_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.19.0.0/16
